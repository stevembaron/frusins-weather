name: Update Daily Ski Deals

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ski-deals
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make publish helper executable
        run: chmod +x scripts/publish_generated_report.sh

      - name: Run ski deal monitor
        run: python3 scripts/deal_monitor.py

      - name: Publish updated report
        run: >
          scripts/publish_generated_report.sh
          "Update daily ski deals"
          data/deal_report.md
          data/deals.html
          data/deals.json
          ski-deals/index.html
