name: External Daily Deal Refresh

on:
  schedule:
    # GitHub schedules use UTC. This is 4:17 AM MDT / 3:17 AM MST.
    - cron: "17 10 * * *"
    # This is 12:17 PM MDT / 11:17 AM MST.
    - cron: "17 18 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - daily-deals

permissions:
  contents: write

concurrency:
  group: external-daily-deals
  cancel-in-progress: false

jobs:
  update-reports:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make publish helper executable
        run: chmod +x scripts/publish_generated_report.sh

      - name: Run clothing deal monitor
        run: python3 scripts/deal_monitor.py --config config/clothing_deal_sources.json

      - name: Run ski deal monitor
        run: python3 scripts/deal_monitor.py

      - name: Publish updated reports
        run: >
          scripts/publish_generated_report.sh
          "Update daily deal reports"
          data/deal_report.md
          data/deals.html
          data/deals.json
          data/price_history.json
          data/evo_constructor_key.json
          ski-deals/index.html
          data/clothing_deals.json

      # The brief steps are best-effort: a missing CLAUDE_CODE_OAUTH_TOKEN
      # secret or a failed run must never block the deal reports above.
      # The brief is generated by Claude Code billed against the subscription
      # behind the OAuth token (created with `claude setup-token`), not the API.
      # Tokens copied from a terminal often pick up a line-wrap newline, which
      # breaks the auth header — normalize before use.
      - name: Normalize Claude token
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: printf 'CLAUDE_CODE_OAUTH_TOKEN_CLEAN=%s\n' "$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Generate deal brief (Claude)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Generate today's gear deal brief. Work in the repository root.
            1. Run `python3 scripts/deal_analyst.py --dry-run`. Its stdout is your input data.
            2. Read the SYSTEM_PROMPT constant in scripts/deal_analyst.py and follow those
               analyst instructions exactly, applying them to the input data from step 1.
            3. Write the finished brief to /tmp/gear_brief.md — markdown only, starting
               with the `# Gear brief` heading, no preamble or commentary.
            4. Run `python3 scripts/deal_analyst.py --render-only /tmp/gear_brief.md`.
          claude_args: |
            --allowedTools "Bash(python3 scripts/deal_analyst.py*),Read,Write,Glob,Grep"
            --max-turns 12

      - name: Publish deal brief
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        run: >
          scripts/publish_generated_report.sh
          "Update daily deal brief"
          data/deal_brief.md
          data/briefs
          deal-brief/index.html
