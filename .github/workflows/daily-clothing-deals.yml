name: Update Daily Clothing Deals

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-clothing-deals
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make publish helper executable
        run: chmod +x scripts/publish_generated_report.sh

      - name: Run clothing deal monitor
        run: python3 scripts/deal_monitor.py --config config/clothing_deal_sources.json

      - name: Publish updated report
        run: >
          scripts/publish_generated_report.sh
          "Update daily clothing deals"
          data/clothing_deal_report.md
          data/clothing_deals.html
          data/clothing_deals.json
          clothing-deals/index.html
