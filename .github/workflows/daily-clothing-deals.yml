name: Update Daily Clothing Deals

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-clothing-deals
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run clothing deal monitor
        run: python3 scripts/deal_monitor.py --config config/clothing_deal_sources.json

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/clothing_deal_report.md data/clothing_deals.html data/clothing_deals.json clothing-deals/index.html
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update daily clothing deals"
          git push origin HEAD:main
